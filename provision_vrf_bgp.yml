---
- name: Provision Customer VRFs, Interfaces, and BGP Using Resource Modules
  hosts: Edge
  gather_facts: false

  tasks:
    - name: Configure VRFs
      cisco.ios.ios_vrf:
        name: "{{ item.name }}"
        rd: "{{ item.rd }}"
        interfaces:
          - "{{ item.interface }}"
        route_import_ipv4: "{{ item.route_targets.import }}"
        route_export_ipv4: "{{ item.route_targets.export }}"
        state: present
      loop: "{{ vrfs }}"

    - name: Ensure interfaces are enabled (no shutdown)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.interface }}"
            enabled: true
        state: merged
      loop: "{{ vrfs }}"

    - name: Configure IPv4 addresses on customer interfaces
      cisco.ios.ios_l3_interfaces:
        config:
          - name: "{{ item.interface }}"
            ipv4:
              - address: "{{ item.ip_address }} {{ item.subnet_mask }}"
        state: merged
      loop: "{{ vrfs }}"

    - name: Configure BGP VRF address-family neighbors
      cisco.ios.ios_bgp_address_family:
        config:
          as_number: "{{ bgp_local_asn }}"
          address_family:
            - afi: ipv4
              vrf: "{{ item.name }}"
              neighbor:
                - address: "{{ item.neighbor_ip }}"
                  remote_as: "{{ item.remote_asn }}"
                  activate: true
        state: merged
      loop: "{{ vrfs }}"
